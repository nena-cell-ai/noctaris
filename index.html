<!DOCTYPE html>
<html lang="es">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#a78bfa">
<meta charset="UTF-8">
<title>Noctaris</title>

<style>
body{
margin:0;
padding:20px;
font-family:'Poppins',sans-serif;

background:
linear-gradient(rgba(4,7,29,0.85), rgba(4,7,29,0.92)),
url('https://images.unsplash.com/photo-1502134249126-9f3755a50d78?q=80&w=1200&auto=format&fit=crop');

background-size:cover;
background-position:center;

color:white;
min-height:100vh;
}

h1{
font-size:42px;
margin-bottom:5px;
font-weight:600;
}

.sub{
color:#d8b4fe;
margin-bottom:25px;
}

.card{
background:rgba(255,255,255,0.08);

backdrop-filter:blur(12px);

border:1px solid rgba(255,255,255,0.1);

border-radius:28px;

padding:22px;

margin-top:20px;

box-shadow:0 8px 32px rgba(0,0,0,0.35);

text-align:center;
}

input{
width:90%;
padding:15px;

border:none;

border-radius:18px;

background:rgba(255,255,255,0.12);

color:white;

font-size:18px;

margin-top:10px;
}

button{
margin-top:18px;

width:100%;

padding:16px;

border:none;

border-radius:20px;

background:linear-gradient(90deg,#8b5cf6,#c084fc);

color:white;

font-size:17px;

font-weight:600;

box-shadow:0 4px 20px rgba(168,85,247,0.4);
}

button:active{
transform:scale(0.98);
}

#mascota{
width:220px;
margin-top:10px;

filter:drop-shadow(0 0 18px rgba(192,132,252,0.5));
}

#estadoMascota{
margin-top:10px;
color:#f5d0fe;
font-size:22px;
font-weight:600;
}

#frase{
margin-top:15px;

font-style:italic;

color:#ddd6fe;
}

#racha{
font-size:22px;

margin-top:15px;

font-weight:600;

color:#c084fc;
}

.lista{
margin-top:20px;

text-align:left;
}

.small{
background:rgba(255,255,255,0.06);

padding:10px;

border-radius:14px;

margin-top:10px;

.navbar{

position:fixed;

bottom:15px;

left:50%;

transform:translateX(-50%);

width:90%;

display:flex;

justify-content:space-around;

align-items:center;

padding:14px 10px;

border-radius:28px;

background:rgba(18,18,40,0.75);

backdrop-filter:blur(14px);

border:1px solid rgba(255,255,255,0.1);

box-shadow:0 8px 30px rgba(0,0,0,0.4);

z-index:999;
}

.navitem{

display:flex;

flex-direction:column;

align-items:center;

font-size:20px;

color:#d8b4fe;

opacity:0.7;
}

.navitem p{

margin:3px 0 0;

font-size:11px;
}

.active{

opacity:1;

color:white;
}
}
</style>
</head>

<body>

<h1>🌙 Noctaris ✨</h1>
<p class="sub">Tu espacio para descansar mejor</p>

<div class="card">

<img id="mascota" src="gatita.png">

<h2 id="estadoMascota">
Tu gatita está esperando 💜
</h2>

<p id="frase"></p>

<div class="card">
<h3>¿A qué hora dormirás hoy?</h3>

<input type="time" id="hora">
<br>

<button onclick="guardarHora()">Guardar 🌙</button>
<button onclick="borrarDatos()">Reiniciar 🔄</button>

<p id="frase"></p>
<p id="racha"></p>

<div class="lista" id="lista"></div>

</div>

<script>
function actualizarMascota() {
  let datos = JSON.parse(localStorage.getItem("registroSueño")) || [];

  let mascota = document.getElementById("mascota");
  let estado = document.getElementById("estadoMascota");

  if (datos.length === 0) {
    mascota.innerText = "😴";
    estado.innerText = "Tu mascota está esperando que empieces 💜";
    return;
  }

  if (datos.length < 3) {
    mascota.innerText = "🙂";
    estado.innerText = "Tu mascota está creciendo contigo 🌱";
  } else if (datos.length < 6) {
    mascota.innerText = "😊";
    estado.innerText = "¡Tu mascota está feliz! 💜";
  } else {
    mascota.innerText = "😄";
    estado.innerText = "¡Tu mascota está súper fuerte gracias a ti! 🌟";
  }
}
  
const frases = [
"Descansar también es avanzar 💜",
"Mañana será un nuevo comienzo ✨",
"Tu cuerpo merece paz 🌙",
"Hoy hiciste lo suficiente 💫",
"Respira, suelta y descansa 💤"
];

function mostrarFrase() {
  const random = Math.floor(Math.random() * frases.length);
  document.getElementById("frase").innerText = frases[random];
}

function guardarHora() {
  actualizarMascota();
  let hora = document.getElementById("hora").value;

  if (hora === "") return;

  let datos = JSON.parse(localStorage.getItem("registroSueño")) || [];

  const hoy = new Date().toLocaleDateString();

  datos.push({ fecha: hoy, hora: hora });

  localStorage.setItem("registroSueño", JSON.stringify(datos));

  mostrarDatos();
}

function mostrarDatos() {
  let datos = JSON.parse(localStorage.getItem("registroSueño")) || [];

  let lista = document.getElementById("lista");
  lista.innerHTML = "<h4>Historial:</h4>";

  datos.slice(-5).reverse().forEach(d => {
    lista.innerHTML += `<p class="small">🌙 ${d.fecha} → ${d.hora}</p>`;
  });

  document.getElementById("racha").innerText =
    "🔥 Registros guardados: " + datos.length;
}

function borrarDatos() {
  localStorage.removeItem("registroSueño");
  mostrarDatos();
}

mostrarFrase();
mostrarDatos();
actualizarMascota();

</script>

<div class="navbar">

<div class="navitem active">
🏠
<p>Inicio</p>
</div>

<div class="navitem">
📊
<p>Historial</p>
</div>

<div class="navitem">
🏆
<p>Logros</p>
</div>

<div class="navitem">
⚙️
<p>Ajustes</p>
</div>

</div>
  
</body>
</html>
