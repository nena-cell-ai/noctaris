<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Noctaris 🌙</title>

<link rel="manifest" href="manifest.json">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;

background:
linear-gradient(rgba(5,7,30,0.88), rgba(5,7,30,0.95)),
url('https://images.unsplash.com/photo-1502134249126-9f3755a50d78?q=80&w=1200&auto=format&fit=crop');

background-size:cover;
background-position:center;

color:white;

min-height:100vh;

padding:20px 20px 120px;
}

/* TITULOS */

h1{
font-size:42px;
font-weight:600;
margin-bottom:5px;

text-shadow:0 0 15px rgba(192,132,252,0.5);
}

.sub{
color:#d8b4fe;
margin-bottom:25px;
font-size:15px;
}

/* CARD */

.card{
background:rgba(255,255,255,0.08);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,0.1);

border-radius:30px;

padding:24px;

margin-top:20px;

box-shadow:
0 8px 32px rgba(0,0,0,0.35),
0 0 20px rgba(168,85,247,0.15);

text-align:center;
}

/* MASCOTA */

#mascota{
width:240px;

margin-top:10px;

animation:flotar 4s ease-in-out infinite;

filter:
drop-shadow(0 0 25px rgba(192,132,252,0.5));
}

@keyframes flotar{
0%{
transform:translateY(0px);
}

50%{
transform:translateY(-10px);
}

100%{
transform:translateY(0px);
}
}

#estadoMascota{
margin-top:15px;

font-size:22px;

font-weight:600;

color:#f5d0fe;
}

/* FRASES */

#frase{
margin-top:15px;

font-style:italic;

color:#ddd6fe;

font-size:15px;
}

/* INPUT */

input{
width:100%;

padding:16px;

margin-top:15px;

border:none;

border-radius:20px;

background:rgba(255,255,255,0.1);

color:white;

font-size:18px;

outline:none;
}

/* BOTONES */

button{
width:100%;

padding:16px;

margin-top:15px;

border:none;

border-radius:20px;

background:linear-gradient(
90deg,
#8b5cf6,
#c084fc
);

color:white;

font-size:16px;

font-weight:600;

cursor:pointer;

transition:0.3s;

box-shadow:
0 4px 20px rgba(168,85,247,0.35);
}

button:hover{
transform:translateY(-2px);
}

button:active{
transform:scale(0.98);
}

/* RACHA */

#racha{
margin-top:18px;

font-size:20px;

font-weight:600;

color:#c084fc;
}

/* HISTORIAL */

.lista{
margin-top:20px;

text-align:left;
}

.small{
background:rgba(255,255,255,0.06);

padding:14px;

border-radius:16px;

margin-top:10px;

backdrop-filter:blur(10px);
}

/* NAVBAR */

.navbar{
position:fixed;

bottom:18px;

left:50%;

transform:translateX(-50%);

width:92%;

display:flex;

justify-content:space-around;

align-items:center;

padding:16px 10px;

border-radius:30px;

background:rgba(18,18,40,0.78);

backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,0.1);

box-shadow:
0 8px 30px rgba(0,0,0,0.4);

z-index:999;
}

.navitem{
display:flex;

flex-direction:column;

align-items:center;

font-size:22px;

color:#d8b4fe;

opacity:0.7;

transition:0.3s;
}

.navitem p{
font-size:11px;
margin-top:4px;
}

.active{
opacity:1;
color:white;

transform:translateY(-2px);
}

/* LOGROS */

#logros{
margin-top:15px;

line-height:1.8;
}

</style>
</head>

<body>

<h1>🌙 Noctaris</h1>

<p class="sub">
Tu refugio nocturno para descansar mejor ✨
</p>

<!-- MASCOTA -->

<div class="card">

<img id="mascota" src="gatita.png">

<h2 id="estadoMascota">
Tu gatita está esperando 💜
</h2>

<p id="frase"></p>

</div>

<!-- REGISTRO -->

<div class="card">

<h3>¿A qué hora dormirás hoy?</h3>

<input type="time" id="hora">

<button onclick="guardarHora(); actualizarLogros();">
Guardar 🌙
</button>

<button onclick="borrarDatos()">
Reiniciar 🔄
</button>

<p id="racha"></p>

<div class="lista" id="lista"></div>

</div>

<!-- LOGROS -->

<div class="card">

<h2>🏆 Logros</h2>

<div id="logros"></div>

</div>

<!-- NAVBAR -->

<div class="navbar">

<div class="navitem active">
🏠
<p>Inicio</p>
</div>

<div class="navitem">
📊
<p>Historial</p>
</div>

<div class="navitem">
🏆
<p>Logros</p>
</div>

<div class="navitem">
⚙️
<p>Ajustes</p>
</div>

</div>

<script>

/* FRASES */

const frases = [

"Descansar también es avanzar 💜",

"Mañana será un nuevo comienzo ✨",

"Tu cuerpo merece paz 🌙",

"Hoy hiciste lo suficiente 💫",

"Respira, suelta y descansa 💤"

];

/* FRASE RANDOM */

function mostrarFrase(){

const random =
Math.floor(Math.random() * frases.length);

document.getElementById("frase").innerText =
frases[random];
}

/* GUARDAR HORA */

function guardarHora(){

let hora =
document.getElementById("hora").value;

if(hora === "") return;

let datos =
JSON.parse(localStorage.getItem("registroSueño")) || [];

const hoy =
new Date().toLocaleDateString();

datos.push({

fecha:hoy,
hora:hora

});

localStorage.setItem(
"registroSueño",
JSON.stringify(datos)
);

mostrarDatos();

actualizarMascota();
}

/* MOSTRAR DATOS */

function mostrarDatos(){

let datos =
JSON.parse(localStorage.getItem("registroSueño")) || [];

let lista =
document.getElementById("lista");

lista.innerHTML =
"<h4>Historial:</h4>";

datos.slice(-5).reverse().forEach(d => {

lista.innerHTML += `
<p class="small">
🌙 ${d.fecha} → ${d.hora}
</p>
`;

});

document.getElementById("racha").innerText =
"🔥 Registros guardados: " + datos.length;
}

/* BORRAR */

function borrarDatos(){

localStorage.removeItem("registroSueño");

mostrarDatos();

actualizarMascota();

actualizarLogros();
}

/* MASCOTA */

function actualizarMascota(){

let datos =
JSON.parse(localStorage.getItem("registroSueño")) || [];

let mascota =
document.getElementById("mascota");

let estado =
document.getElementById("estadoMascota");

let cantidad = datos.length;

if(cantidad <= 2){

mascota.src = "gatita.png";

estado.innerText =
"Tu gatita acaba de despertar 🌙";

}

else if(cantidad <= 5){

mascota.src = "gatita1.png";

estado.innerText =
"Tu gatita está creciendo contigo ✨";

}

else if(cantidad <= 10){

mascota.src = "gatita2.png";

estado.innerText =
"Tu gatita se siente feliz y protegida 💜";

}

else{

mascota.src = "gatita3.png";

estado.innerText =
"Tu gatita lunar alcanzó su forma mágica 😭✨";

}

}

/* LOGROS */

function actualizarLogros(){

let datos =
JSON.parse(localStorage.getItem("registroSueño")) || [];

let logros =
document.getElementById("logros");

let cantidad = datos.length;

logros.innerHTML = "";

if(cantidad >= 3){

logros.innerHTML +=
"🌙 Primera racha desbloqueada <br>";

}

if(cantidad >= 7){

logros.innerHTML +=
"✨ Guardiana de sueños <br>";

}

if(cantidad >= 14){

logros.innerHTML +=
"🏆 Maestra del descanso";

}

}

/* INICIO */

mostrarFrase();

mostrarDatos();

actualizarMascota();

actualizarLogros();

</script>

</body>
</html>
