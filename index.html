<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#a78bfa">
<meta charset="UTF-8">
<title>Noctaris</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(to bottom, #0f172a, #020617);
  color: white;
  text-align: center;
  padding: 20px;
}

h1 {
  font-size: 2.5em;
}

.card {
  background: rgba(255,255,255,0.08);
  padding: 20px;
  border-radius: 20px;
  margin-top: 20px;
  box-shadow: 0 0 25px rgba(0,0,0,0.6);
}

input {
  padding: 10px;
  border-radius: 10px;
  border: none;
}

button {
  margin-top: 10px;
  padding: 12px 20px;
  border: none;
  border-radius: 15px;
  background: #a78bfa;
  color: white;
  font-size: 15px;
}

button:active {
  background: #7c3aed;
}

.small {
  font-size: 13px;
  color: #c4b5fd;
}

#frase {
  margin-top: 15px;
  font-style: italic;
  color: #e9d5ff;
}

#racha {
  margin-top: 10px;
  font-weight: bold;
}

.lista {
  margin-top: 10px;
  text-align: left;
}
</style>
</head>

<body>

<h1>🌙 Noctaris ✨</h1>
  <div id="mascota" style="font-size:60px; margin-top:10px;">😴</div>
<p id="estadoMascota"></p>
<p>Descansa mejor, vive mejor 💜</p>

<div class="card">

<h3>¿A qué hora dormirás hoy?</h3>

<input type="time" id="hora">
<br>

<button onclick="guardarHora()">Guardar 🌙</button>
<button onclick="borrarDatos()">Reiniciar 🔄</button>

<p id="frase"></p>
<p id="racha"></p>

<div class="lista" id="lista"></div>

</div>

<script>
function actualizarMascota() {
  let datos = JSON.parse(localStorage.getItem("registroSueño")) || [];

  let mascota = document.getElementById("mascota");
  let estado = document.getElementById("estadoMascota");

  if (datos.length === 0) {
    mascota.innerText = "😴";
    estado.innerText = "Tu mascota está esperando que empieces 💜";
    return;
  }

  if (datos.length < 3) {
    mascota.innerText = "🙂";
    estado.innerText = "Tu mascota está creciendo contigo 🌱";
  } else if (datos.length < 6) {
    mascota.innerText = "😊";
    estado.innerText = "¡Tu mascota está feliz! 💜";
  } else {
    mascota.innerText = "😄";
    estado.innerText = "¡Tu mascota está súper fuerte gracias a ti! 🌟";
  }
}
  
const frases = [
"Descansar también es avanzar 💜",
"Mañana será un nuevo comienzo ✨",
"Tu cuerpo merece paz 🌙",
"Hoy hiciste lo suficiente 💫",
"Respira, suelta y descansa 💤"
];

function mostrarFrase() {
  const random = Math.floor(Math.random() * frases.length);
  document.getElementById("frase").innerText = frases[random];
}

function guardarHora() {
  actualizarMascota();
  let hora = document.getElementById("hora").value;

  if (hora === "") return;

  let datos = JSON.parse(localStorage.getItem("registroSueño")) || [];

  const hoy = new Date().toLocaleDateString();

  datos.push({ fecha: hoy, hora: hora });

  localStorage.setItem("registroSueño", JSON.stringify(datos));

  mostrarDatos();
}

function mostrarDatos() {
  let datos = JSON.parse(localStorage.getItem("registroSueño")) || [];

  let lista = document.getElementById("lista");
  lista.innerHTML = "<h4>Historial:</h4>";

  datos.slice(-5).reverse().forEach(d => {
    lista.innerHTML += `<p class="small">🌙 ${d.fecha} → ${d.hora}</p>`;
  });

  document.getElementById("racha").innerText =
    "🔥 Registros guardados: " + datos.length;
}

function borrarDatos() {
  localStorage.removeItem("registroSueño");
  mostrarDatos();
}

mostrarFrase();
mostrarDatos();
actualizarMascota();

</script>

</body>
</html>
